<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">

    <title>Artifact Colors Editor</title>
    <style>
        .buttonRow {
            width: 160px;
            line-height: 0;
        }
        
        #buttonRow3 {
            width: 140px;
        }

        #currentColourBox {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 160px;
            height: 80px;
            overflow: hidden;
            border: 1px solid black;
            box-sizing: border-box;
        }

        #currentColour {
            background: black;
            border-radius: 200px;
            flex-shrink: 0;
        }

        .green {
            filter: grayscale(100%) sepia(100%) hue-rotate(72deg) saturate(100);
        }

        .colourButton {
            width: 20px;
            height: 20px;
            padding: 0;
        }

        .duplicate {
            border-color: white;
        }

        .selected {
            border-color: lightgrey;
            border-style: solid;
            position: relative;
        }

        .selected::after {
            content: "*";
            position: absolute;
        }

        .gradient {
            border-color: lightcoral;
        }

        canvas {
            image-rendering: pixelated;
            display: block;
        }

        .canvasBackground {
            display: inline-block;
            width: fit-content;
            border: 1px solid purple;
            zoom: 4;
            margin: 1px;

            /* Size of the grey background squares */
            --s: 12px;
            --c1: #c8c8c8;
            --c2: #4b4b4b;

            background-color: var(--c1);
            background-image:
                linear-gradient(45deg, var(--c2) 25%, transparent 25%),
                linear-gradient(-45deg, var(--c2) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, var(--c2) 75%),
                linear-gradient(-45deg, transparent 75%, var(--c2) 75%);
            background-size: calc(var(--s) * 2) calc(var(--s) * 2);
            background-position:
                0 0,
                0 var(--s),
                var(--s) calc(-1 * var(--s)),
                var(--s) 0;
        }

        label {
            display: inline-block;
        }
    </style>
</head>

<body>
    <input type="file" id="fileInput" accept="image/png">
    <button id="reload" type="button">Reload</button>
    <button id="save" type="button">Save</button>
    <div>
        <canvas id="original" width="48px" height="48px" class="canvasBackground"> </canvas>
        <canvas id="colour" width="48px" height="48px" class="canvasBackground"> </canvas>
        <div class="canvasBackground"><canvas id="bw" width="48px" height="48px" class="green"> </canvas></div>
        <canvas id="artifact" width="48px" height="48px" style="display: none;" class="canvasBackground"> </canvas>
        <canvas id="blur" width="48px" height="48px" class="canvasBackground"> </canvas>
    </div>
    <div id="buttonRow" class="buttonRow"> </div>
    <div id="currentColourBox">
        <div id="currentColour"> </div>
    </div>
    <div style="width:160px">
        <label for="radius">Brush Size:</label>
        <input type="range" id="radius" name="radius" min="0" max="49" value="2" style="width:55px">
        <span id="radius-value">3</span>
    </div>
    <button id="generateGradient" type="button">Generate Gradient</button>
    <div id="buttonRow2" class="buttonRow">
    </div>
    <div style="width:160px">
        <label for="draw"><input type="radio" id="draw" name="tool" value="draw" checked>&nbsp;Draw</label>
        <label for="drawBehind"><input type="radio" id="drawBehind" name="tool" value="drawBehind">&nbsp;Draw Behind</label>
        <label for="erase"><input type="radio" id="erase" name="tool" value="erase">&nbsp;Erase</label>
        <label for="eraseColour"><input type="radio" id="eraseColour" name="tool" value="eraseColour">&nbsp;Erase Colour</label>
        <label for="fill" style="display: none;"><input type="radio" id="fill" name="tool" value="fill">&nbsp;Fill</label>
    </div>
    <div id="buttonRow3" class="buttonRow">
    </div>
    
    <script>
        let width = 48;
        let height = 48;

        document.getElementById("fileInput").addEventListener("change", handleFile);

        const primaryFrac = 1;
        const secondaryFrac = 1;

        function colours() {
            const colours = [];
            const xPrime = 127.5 * primaryFrac;
            const xSecondary = 127.5 * secondaryFrac / 2;
            const xSecondary1 = xSecondary;
            const xSecondary2 = xSecondary;
            for (let index = 0; index < 64; index++) {
                const r = index & 1;
                const g = index >>> 1 & 1;
                const b = index >>> 2 & 1;
                const c = index >>> 3 & 1;
                const m = index >>> 4 & 1;
                const y = index >>> 5 & 1;

                const colour = [
                    Math.floor(Math.min(255, xPrime * r + xSecondary1 * m + xSecondary2 * y)),
                    Math.floor(Math.min(255, xPrime * g + xSecondary1 * y + xSecondary2 * c)),
                    Math.floor(Math.min(255, xPrime * b + xSecondary1 * c + xSecondary2 * m))
                ];
                const hsl = rgbToHsl(colour[0], colour[1], colour[2]);
                colours.push({
                    r: r,
                    g: g,
                    b: b,
                    c: c,
                    m: m,
                    y: y,
                    colour: colour,
                    h: hsl.h,
                    s: hsl.s,
                    l: hsl.l,
                    index: index
                });
            }
            return colours;
        }

        const referenceColours = colours();
        const uniqueColours = [];
        const duplicateColours = [];
        findUniqueColours();

        function hex(value) {
            return value.toString(16).padStart(2, "0");
        }

        function findUniqueColours() {
            for (const colour of referenceColours) {
                let isUnique = true;
                for (const uniqueColour of uniqueColours) {
                    const diff = diffBetweenColours(colour, uniqueColour);
                    if (diff < 3) {
                        isUnique = false;
                        duplicateColours.push(colour);
                        break;
                    }
                }
                if (isUnique) uniqueColours.push(colour);
            }
        }

        function createButtons(colours) {
            const buttonRow = document.getElementById("buttonRow");
            function hAdjust(h) {
                return (h + 20) % 360;
            }
            const sortedColours = [...colours].sort((a, b) =>
                (a.s == 0 ? 1: 0) - (b.s == 0 ? 1 : 0)
                || (hAdjust(a.h) - hAdjust(b.h))
                || (a.l - b.l));
            for (let i = 0; i < sortedColours.length; i++) {
                const colour = sortedColours[i];
                createButton(buttonRow, colour, colours == duplicateColours);
            }
        }

        function hueDiff(a, b) {
            const diff = Math.abs(a.h - b.h);
            return diff <= 180 ? diff : 360 - diff;
        }

        let stockGradients = [];

        function createManyGradients() {
            const buttonRow3 = document.getElementById("buttonRow3");
            const bits = ["r", "g", "b", "c", "m", "y"];
            const gradientBitLists = getPermutations(bits).map(l => l.slice(0, -1));
            let gradients = [];
            for (const gradientBits of gradientBitLists) {
                const c = { r: 0, g: 0, b: 0, c: 0, m: 0, y: 0 };
                let gradient = [];
                for (bit of gradientBits) {
                    c[bit] = 1;
                    gradient.push(findColour(c));
                }
                let looksOK = true;
                const midColour = gradient[2];
                if (midColour.r == midColour.g && midColour.r == midColour.b && midColour.c == midColour.m && midColour.c == midColour.y) {
                    // grey
                    continue;
                }
                let cumulativeDiff = 0; 
                for (let i = 1; i < gradient.length; i++) {
                    const prevColour = gradient[i - 1];
                    const colour = gradient[i];
                    const diff = hueDiff(prevColour, colour);
                    cumulativeDiff += diff;
                    if (diff > 40 || cumulativeDiff > 100) {
                        looksOK = false;
                        continue;
                    }
                }
                if (!looksOK) continue;
                gradient = [referenceColours[0], ...gradient, referenceColours[63]];
                gradients.push(gradient);
            }
            stockGradients = [gradients[2], gradients[3], gradients[14], gradients[15], gradients[18], gradients[19]];
            for (let i = 0; i < stockGradients.length; i++) {
                const gradient = stockGradients[i];
                for (const colour of gradient) {
                    createButton(buttonRow3, colour, false, i);
                }
            }
        }

        const getPermutations = arr => {
            // Base case: if the array is empty, return an array with an empty array inside
            if (arr.length === 0) return [[]];

            const results = [];

            for (let i = 0; i < arr.length; i++) {
                const currentItem = arr[i];
                // Create a remaining array by excluding the current item
                const remainingItems = [...arr.slice(0, i), ...arr.slice(i + 1)];

                // Recursively get permutations of the remaining items
                const remainingPermutations = getPermutations(remainingItems);

                // Combine the current item with each of the remaining permutations
                for (const permutation of remainingPermutations) {
                    results.push([currentItem, ...permutation]);
                }
            }

            return results;
        };

        function createButton(buttonRow, colour, isDuplicate, gradientIndex) {
            const button = document.createElement("button");
            button.className = "colourButton";
            button.type = "button";
            button.setAttribute("i", colour.index);
            if (gradientIndex != null) button.setAttribute("g", gradientIndex);
            const background = `#${hex(colour.colour[0])}${hex(colour.colour[1])}${hex(colour.colour[2])}`;
            button.style.background = background;
            if (isDuplicate) {
                button.classList.add("duplicate");
            }
            button.onclick = onColourButtonClick;
            buttonRow.appendChild(button);
        }

        let currentColour = referenceColours[0];
        let brushRadius = 3;

        function setPreviewRadius() {
            const slider = document.getElementById("radius");
            const output = document.getElementById("radius-value");
            brushRadius = parseInt(slider.value);
            output.innerHTML = brushRadius + 1;
            const div = document.getElementById("currentColour");
            div.style.width = `${brushRadius * 2 + 1}px`;
            div.style.height = `${brushRadius * 2 + 1}px`;
        }

        document.getElementById("radius").oninput = setPreviewRadius;
        setPreviewRadius();

        function onGenerateGradientClick() {
            generateGradient(currentColour);
        }

        document.getElementById("generateGradient").onclick = onGenerateGradientClick;

        let currentGradient = null;

        function onColourButtonClick(event) {
            const button = event.target;
            const i = parseInt(button.getAttribute("i"));
            currentColour = referenceColours[i];
            var div = document.getElementById("currentColour");
            const background = `#${hex(currentColour.colour[0])}${hex(currentColour.colour[1])}${hex(currentColour.colour[2])}`;
            div.style.background = background;

            var box = document.getElementById("currentColourBox");
            box.style.background = currentColour.l >= 50 ? "black" : "white";

            const gradientIndex = button.getAttribute("g");
            currentGradient = gradientIndex;

            const buttons = document.getElementById("buttonRow").children;
            const buttons2 = document.getElementById("buttonRow2").children;
            const buttons3 = document.getElementById("buttonRow3").children;
            for (const thisButton of [...buttons, ...buttons2, ...buttons3]) {
                if (gradientIndex !== null && thisButton.getAttribute("g") == gradientIndex) {
                    thisButton.classList.add("gradient");
                } else {
                    thisButton.classList.remove("gradient");
                }
                if (thisButton.getAttribute("i") == i) {
                    thisButton.classList.add("selected");
                } else {
                    thisButton.classList.remove("selected");
                }
            }
        }

        let customGradient;

        function generateGradient(targetColour) {
            var row = document.getElementById("buttonRow2");
            row.innerHTML = "";
            let gradient = [targetColour];
            let c = structuredClone(targetColour);
            let bits = ["r", "g", "b", "c", "m", "y"];
            shuffleArray(bits);

            // find darker colours
            while (bitLuma(c) > 0) {
                for (const bit of bits) {
                    if (c[bit])
                    {
                        c[bit] = 0;
                        gradient.push(findColour(c));
                        break;
                    }
                }
            }

            gradient.reverse();

            // find lighter colours
            c = structuredClone(targetColour);
            while (bitLuma(c) < 6) {
                for (const bit of bits) {
                    if (!c[bit]) {
                        c[bit] = 1;
                        gradient.push(findColour(c));
                        break;
                    }
                }
            }
            for (const colour of gradient) {
                createButton(row, colour, false, -1);
            }
            customGradient = gradient;
        }

        function findColour(c) {
            let bits = ["r", "g", "b", "c", "m", "y"];
            for (const color of referenceColours) {
                let possibleMatch = true;
                for (const bit of bits) {
                    if (c[bit] != color[bit]){
                        possibleMatch = false;
                        break;
                    }
                }
                if (possibleMatch) {
                    return color;
                }
            }
        }

        function bitLuma(c) {
            return c.r + c.g + c.b + c.c + c.m + c.y;
        }

        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;

            // While there remain elements to shuffle.
            while (currentIndex !== 0) {
                // Pick a remaining element.
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;

                // And swap it with the current element.
                [array[currentIndex], array[randomIndex]] = [
                    array[randomIndex], array[currentIndex]];
            }
        }

        let startX;
        let startY;
        let isMouseDown;
        let isErase;
        let isEraseColour;
        let isDrawBehind;

        function onCanvasLeave(event) {
            isMouseDown = false;
            const canvas = event.target;
            if (canvas.id == "original") {
                const ctx = canvas.getContext("2d", { willReadFrequently: true });
                ctx.reset();
                if (img) ctx.drawImage(img, 0, 0, width, height);
            }
            if (canvas.id == "colour") renderColour();
            if (canvas.id == "bw") renderBw();
            if (canvas.id == "artifact") renderArtifactColors();
            if (canvas.id == "blur") renderArtifactColors();
        }

        function getMousePosition(event) {
            const canvas = event.target;
            const rect = canvas.getBoundingClientRect();
            let x = Math.floor((event.clientX - rect.left) / canvas.currentCSSZoom);
            let y = Math.floor((event.clientY - rect.top) / canvas.currentCSSZoom);

            if (canvas.id != "bw") {
                x -= 1;
                y -= 1;
            }
            return [x, y];
        }

        function onCanvasDown(event) {
            const canvas = event.target;
            if (event.button !== 0 || event.buttons > 1) { // Left click only
                if (canvas.id == "colour") renderColour();
                if (canvas.id == "bw") renderBw();
                if (canvas.id == "artifact") renderArtifactColors();
                if (canvas.id == "blur") renderArtifactColors();
                return;
            }
            isMouseDown = true;

            [startX, startY] = getMousePosition(event);
        }

        function onCanvasUp(event) {
            if (event.button !== 0 || event.buttons > 1) return; // Left click only
            isMouseDown = false;
            const canvas = event.target;
            const [endX, endY] = getMousePosition(event);
            if (isEraseColour) {
                const ctx = canvas.getContext("2d", { willReadFrequently: true });

                // Reset canvas image so we can read from it to determine where to erase
                if (canvas.id == "colour") renderColour();
                if (canvas.id == "bw") renderBw();
                if (canvas.id == "artifact") renderArtifactColors();
                if (canvas.id == "blur") renderArtifactColors();
                if (canvas.id == "original") {
                    ctx.reset();
                    if (img) ctx.drawImage(img, 0, 0, width, height);
                }
                
                const imgData = ctx.getImageData(0, 0, width, height);
                const data = imgData.data;

                const mouseIdx = (endY * width + endX) * 4;
                const r = data[mouseIdx];
                const g = data[mouseIdx + 1];
                const b = data[mouseIdx + 2];
                const a = data[mouseIdx + 3];
                const threshold = 25;
                if (!a) return;

                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) { 
                        const idx = (y * width + x) * 4;
                        if (Math.abs(data[idx] - r) > threshold) continue;
                        if (Math.abs(data[idx + 1] - g) > threshold) continue;
                        if (Math.abs(data[idx + 2] - b) > threshold) continue;
                        if (Math.abs(data[idx + 3] - a) > threshold) continue;

                        colourBuffer[y][x] = 0;
                        alphaBuffer[y][x] = 0;
                    }
                }
            } else {
                const radiusSquared = brushRadius * brushRadius;

                const colour = isErase ? 0 : currentColour.index;
                const alpha = isErase ? 0 : 1;

                // if len is 0, we draw 1 pixel
                const len = Math.max(Math.abs(endX - startX), Math.abs(endY - startY)) || 1;
                for (let i = 0; i <= len; i++) {
                    const x = Math.round(startX + i * (endX - startX) / len);
                    const y = Math.round(startY + i * (endY - startY) / len);
                    for (let y2 = -brushRadius; y2 <= brushRadius; y2++) {
                        const y1 = y + y2;
                        if (y1 < 0 || y1 >= height) continue;
                        for (let x2 = -brushRadius; x2 <= brushRadius; x2++) {
                            if (Math.floor(x2 * x2 + y2 * y2 - 0.5) > radiusSquared) continue;
                            const x1 = x + x2;
                            if (x1 < 0 || x1 >= width) continue;
                            
                            if (isDrawBehind && alphaBuffer[y1][x1]) continue;
                            colourBuffer[y1][x1] = colour;
                            alphaBuffer[y1][x1] = alpha;
                        }
                    }
                }
            }

            renderColour()
            renderToMonoBuffer();
            renderBw();
            renderArtifactColors();
        }

        function onCanvasMove(event) {
            if (event.buttons > 1) return; // Left button or no button only
            const selectedTool = document.querySelector("input[name='tool']:checked")?.value;
            isErase = selectedTool == "erase";
            isEraseColour = selectedTool == "eraseColour";
            isDrawBehind = selectedTool == "drawBehind";

            const [endX, endY] = getMousePosition(event);
            if (!isMouseDown) {
                startX = endX;
                startY = endY;
            }

            const canvas = event.target;
            const ctx = canvas.getContext("2d", { willReadFrequently: true });

            if (canvas.id == "colour") renderColour();
            if (canvas.id == "bw") renderBw();
            if (canvas.id == "artifact") renderArtifactColors();
            if (canvas.id == "blur") renderArtifactColors();
            if (canvas.id == "original") {
                ctx.reset();
                if (img) ctx.drawImage(img, 0, 0, width, height);
            }

            const imgData = ctx.getImageData(0, 0, width, height);
            const data = imgData.data;

            if (isEraseColour) {
                const mouseIdx = (endY * width + endX) * 4;
                const r = data[mouseIdx];
                const g = data[mouseIdx + 1];
                const b = data[mouseIdx + 2];
                const a = data[mouseIdx + 3];
                const threshold = 25;
                if (!a) return;

                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) {
                        const idx = (y * width + x) * 4;
                        if (Math.abs(data[idx] - r) > threshold) continue;
                        if (Math.abs(data[idx + 1] - g) > threshold) continue;
                        if (Math.abs(data[idx + 2] - b) > threshold) continue;
                        if (Math.abs(data[idx + 3] - a) > threshold) continue;
                        
                        data[idx] = 0;
                        data[idx + 1] = 0;
                        data[idx + 2] = 0;
                        data[idx + 3] = 0;
                    }
                }
            } else {
                const radiusSquared = brushRadius * brushRadius;
                const r = isErase ? 0 : currentColour.colour[0];
                const g = isErase ? 0 : currentColour.colour[1];
                const b = isErase ? 0 : currentColour.colour[2];
                const a = isErase ? 0 : 255;

                // if len is 0, we draw 1 pixel
                const len = Math.max(Math.abs(endX - startX), Math.abs(endY - startY)) || 1;
                for (let i = 0; i <= len; i++) {
                    const x = Math.round(startX + i * (endX - startX) / len);
                    const y = Math.round(startY + i * (endY - startY) / len);
                    for (let y2 = -brushRadius; y2 <= brushRadius; y2++) {
                        const y1 = y + y2;
                        if (y1 < 0 || y1 >= height) continue;
                        for (let x2 = -brushRadius; x2 <= brushRadius; x2++) {
                            if (Math.floor(x2 * x2 + y2 * y2 - 0.5) > radiusSquared) continue;
                            const x1 = x + x2;
                            if (x1 < 0 || x1 >= width) continue;
                            const idx = (y1 * width + x1) * 4;
                            if (isDrawBehind && data[idx + 3] > 0) continue;
                            data[idx] = r;
                            data[idx + 1] = g;
                            data[idx + 2] = b;
                            data[idx + 3] = a;
                        }
                    }
                }
            }

            ctx.putImageData(imgData, 0, 0);
        }

        function setCanvasHandlers(id) {
            const canvas = document.getElementById(id);
            canvas.onmousedown = onCanvasDown;
            canvas.onmouseup = onCanvasUp;
            canvas.onmouseleave = onCanvasLeave;
            canvas.onmousemove = onCanvasMove;
        }

        createButtons(uniqueColours);
        createButtons(duplicateColours);
        createManyGradients();

        /**
         * Creates a 2D array (matrix) of a given width and height, filled with a specific value.
         * @param {number} rows - The number of outer arrays (height).
         * @param {number} cols - The number of elements in each inner array (width).
         * @param {*} value - The initial value for each element.
         * @returns {Array<Array<*>>} The 2D array.
         */
        function createMatrix(rows, cols, value = 0) {
            // Create 'rows' number of outer array elements, mapping each to a new inner array
            const matrix = Array.from({ length: rows }, () =>
                // For each inner array, create 'cols' number of elements filled with the value
                Array.from({ length: cols }, () => value)
            );
            return matrix;
        }

        let colourBuffer = createMatrix(height, width);
        let monoBuffer = createMatrix(height, width);
        let alphaBuffer = createMatrix(height, width);
        let img;

        function renderToMonoBuffer() {
            // Convert to monochrome buffer
            // (colours that are not close to black or white are converted to dither patterns
            // which approximately preserve lightness and correspond to 61 specific colours)

            for (let y = 0; y < height; y++) {
                const rowPhase = y % 2;
                const colourRow = colourBuffer[y];
                const monoRow = monoBuffer[y];
                const alphaRow = alphaBuffer[y];
                for (let x = 0; x < width; x++) {
                    const colour = referenceColours[colourRow[x]];
                    const phase = x % 3;
                    if (rowPhase) {
                        monoRow[x] = [colour.c, colour.m, colour.y][phase];
                    } else {
                        monoRow[x] = [colour.r, colour.g, colour.b][phase];
                    }
                }
            }
        }

        function processImage() {
            const originalCanvas = document.getElementById("original");
            const originalCtx = originalCanvas.getContext("2d", { willReadFrequently: true });
            const imgData = originalCtx.getImageData(0, 0, width, height);

            let colourSet = uniqueColours;
            if (currentGradient != null) {
                if (currentGradient == -1) {
                    colourSet = customGradient;
                } else {
                    colourSet = stockGradients[currentGradient];
                }
            }

            // Convert to colour buffer
            // (51 colour palette by default, or 7 if a gradient is selected)
            for (let y = 0; y < height; y++) {
                const rowPhase = y % 2;
                const colourRow = colourBuffer[y] = [];
                const alphaRow = alphaBuffer[y] = [];
                for (let x = 0; x < width; x++) {
                    const idx = (y * width + x) * 4;
                    const rImg = imgData.data[idx];
                    const gImg = imgData.data[idx + 1];
                    const bImg = imgData.data[idx + 2];
                    alphaRow[x] = imgData.data[idx + 3] > 127 ? 1 : 0;
                    let result;
                    if (Math.max(rImg, gImg, bImg) < 32) {
                        result = 0; // black
                    } else if (Math.min(rImg, gImg, bImg) > 224) {
                        result = 63; // white
                    } else {
                        const color = [rImg, gImg, bImg];
                        const hslImg = rgbToHsl(rImg, gImg, bImg);
                        const c = { colour: color, h: hslImg.h, s: hslImg.s, l: hslImg.l };
                        const phase = x % 3;
                        const phase2 = (x + 1) % 3;
                        const phase3 = (x + 2) % 3;

                        let maxDist = Number.MAX_SAFE_INTEGER;
                        for (const referenceColour of colourSet) {
                            const dist = diffBetweenColours(c, referenceColour);

                            if (dist < maxDist) {
                                maxDist = dist;
                                result = referenceColour.index;
                            }
                        }
                    }
                    colourRow[x] = result;
                }
            }
            renderColour();
            renderToMonoBuffer();
            renderBw();
            renderArtifactColors();
        }

        document.getElementById("reload").onclick = processImage;

        document.getElementById("save").onclick = save;

        function save() {
            var png = new PNGlib(width, height, 65);
            png.setPallette(referenceColours.map(c => c.colour));
            png.forceAddColorToPalette(0, 0, 0, 0); // colour index 64 is transparent

            for (let y = 0; y < height; y++) {
                const colourRow = colourBuffer[y];
                const alphaRow = alphaBuffer[y];
                for (let x = 0; x < width; x++) {
                    const alpha = alphaRow[x];
                    const colourIndex = alpha ? colourRow[x] : 64;
                    png.setPixel(x, y, colourIndex);
                }
            }
            downloadPng("main.png", png);
        }

        function downloadPng(name, png) {
            var hiddenElement = document.createElement("a");
            hiddenElement.href = "data:image/png;base64," + encodeURI(png.getBase64());
            hiddenElement.target = "_blank";
            hiddenElement.download = name;
            hiddenElement.click();
        }

        function handleFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            img = new Image();
            img.onload = () => {
                width = img.width;
                height = img.height;
                colourBuffer = createMatrix(height, width);
                monoBuffer = createMatrix(height, width);
                alphaBuffer = createMatrix(height, width);

                // Draw image to original canvas
                const originalCanvas = document.getElementById("original");
                originalCanvas.width = width;
                originalCanvas.height = height;
                const originalCtx = originalCanvas.getContext("2d", { willReadFrequently: true });
                originalCtx.drawImage(img, 0, 0, width, height);

                processImage();
            };
            img.src = URL.createObjectURL(file);
        }

        function diffBetweenColours(a, b) {
            const aColour = a.colour;
            const bColour = b.colour;
            const diff = [
                (aColour[0] - bColour[0]) * 1,
                (aColour[1] - bColour[1]) * 1,
                (aColour[2] - bColour[2]) * 1,
                a.l - b.l,
                (a.s - b.s) * 2,
                ((a.h + 360 - b.h) % 360) * Math.max(0, a.s - 10) / 360
            ];
            const dist = diff.reduce((a, v) => a + v * v, 0);
            return dist;
        }

        setCanvasHandlers("original");
        setCanvasHandlers("colour");
        setCanvasHandlers("bw");
        setCanvasHandlers("artifact");
        setCanvasHandlers("blur");

        function rgbToHsl(r, g, b) {
            // Convert RGB to the 0-1 range
            r /= 255;
            g /= 255;
            b /= 255;

            const max = Math.max(r, g, b);
            const min = Math.min(r, g, b);
            let h, s;
            const l = (max + min) / 2;

            if (max === min) {
                h = s = 0; // Achromatic (grey)
            } else {
                let d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);

                switch (max) {
                    case r:
                        h = (g - b) / d + (g < b ? 6 : 0);
                        break;
                    case g:
                        h = (b - r) / d + 2;
                        break;
                    case b:
                        h = (r - g) / d + 4;
                        break;
                }
                h /= 6;
            }

            // Convert hue to degrees (0-360) and saturation/lightness to percentages (0-100)
            return {
                h: Math.round(h * 360),
                s: Math.round(s * 100),
                l: Math.round(l * 100)
            };
        }

        function renderColour() {
            const canvas = document.getElementById("colour");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d", { willReadFrequently: true });
            const imgData = ctx.createImageData(width, height);
            const data = imgData.data;

            for (let y = 0; y < height; y++) {
                const row = colourBuffer[y];
                const alphaRow = alphaBuffer[y];
                for (let x = 0; x < width; x++) {
                    const idx = (y * width + x) * 4;
                    const colour = referenceColours[row[x]].colour;
                    data[idx] = colour[0];
                    data[idx + 1] = colour[1];
                    data[idx + 2] = colour[2];
                    data[idx + 3] = alphaRow[x] * 255;
                }
            }

            ctx.putImageData(imgData, 0, 0);
        }

        function renderBw() {
            const canvas = document.getElementById("bw");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d", { willReadFrequently: true });
            const imgData = ctx.createImageData(width, height);
            const data = imgData.data;

            for (let y = 0; y < height; y++) {
                const row = monoBuffer[y];
                const alphaRow = alphaBuffer[y];
                for (let x = 0; x < width; x++) {
                    const idx = (y * width + x) * 4;
                    const brightness = row[x] * 255
                    data[idx] = brightness;
                    data[idx + 1] = brightness;
                    data[idx + 2] = brightness;
                    data[idx + 3] = alphaRow[x] * 255;
                }
            }

            ctx.putImageData(imgData, 0, 0);
        }

        function renderArtifactColors() {
            const canvas = document.getElementById("artifact");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d", { willReadFrequently: true });
            const imgData = ctx.createImageData(width, height);
            const data = imgData.data;

            for (let y = 0; y < height; y++) {
                const row = monoBuffer[y];
                const alphaRow = alphaBuffer[y];
                for (let x = 0; x < width; x++) {
                    let color = [127, 127, 127];
                    let chromaConfidence = 0;
                    if (x >= 2 && x + 1 < width && row[x - 2] == row[x + 1]) chromaConfidence++;
                    if (x >= 1 && x + 2 < width && row[x - 1] == row[x + 2]) chromaConfidence++;
                    if ((x >= 3 && row[x - 3] == row[x]) || (x + 3 < width && row[x + 3] == row[x])) chromaConfidence += 2;
                    //if (x + 3 < width && row[x + 3] == row[x]) chromaConfidence++;
                    chromaConfidence *= .25;
                    //chromaConfidence *= chromaConfidence;


                    if (chromaConfidence > 0) {
                        const phase = x % 3;

                        color[phase] = row[x] * 255;

                        const phase2 = (phase + 1) % 3;
                        const l2 = x - 2;
                        const r2 = x + 1;
                        if (l2 >= 0 && r2 < width) {
                            if (row[l2] && row[r2]) color[phase2] = 255;
                            if (!row[l2] && !row[r2]) color[phase2] = 0;
                        }

                        const phase3 = (phase + 2) % 3;
                        const l3 = x - 1;
                        const r3 = x + 2;
                        if (l3 >= 0 && r3 < width) {
                            if (row[l3] && row[r3]) color[phase3] = 255;
                            if (!row[l3] && !row[r3]) color[phase3] = 0;
                        }
                    }
                    const brightness = (1 - chromaConfidence) * (row[x] * 255);
                    color = [brightness + color[0] * chromaConfidence, brightness + color[1] * chromaConfidence, brightness + color[2] * chromaConfidence];

                    const idx = (y * width + x) * 4;
                    if (y % 2) {
                        data[idx] = (color[1] + color[2]) * .5;
                        data[idx + 1] = (color[0] + color[2]) * .5;
                        data[idx + 2] = (color[0] + color[1]) * .5;
                    } else {
                        data[idx] = color[0] * primaryFrac;
                        data[idx + 1] = color[1];
                        data[idx + 2] = color[2];
                    }
                    data[idx + 3] = alphaRow[x] * 255;
                }
            }

            ctx.putImageData(imgData, 0, 0);
            renderBlur(data);
        }

        function renderBlur(data1) {
            const canvas = document.getElementById("blur");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            const imgData = ctx.createImageData(width, height);
            const data = imgData.data;

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const idx = (y * width + x) * 4;
                    const w2 = (y % 2) ? primaryFrac : secondaryFrac;
                    const w1 = (y % 2) ? secondaryFrac : primaryFrac;
                    let r = data1[idx] * w1;
                    let g = data1[idx + 1] * w1;
                    let b = data1[idx + 2] * w1;
                    let a = data1[idx + 3] * w1;
                    let t = 1 * w1;

                    if (y > 0) {
                        const idx2 = ((y - 1) * width + x) * 4;
                        r += data1[idx2] * w2 * .5;
                        g += data1[idx2 + 1] * w2 * .5;
                        b += data1[idx2 + 2] * w2 * .5;
                        a += data1[idx2 + 3] * w2 * .5;
                        t += .5 * w2;
                    }
                    if (y + 1 < height) {
                        const idx3 = ((y + 1) * width + x) * 4;
                        r += data1[idx3] * w2 * .5;
                        g += data1[idx3 + 1] * w2 * .5;
                        b += data1[idx3 + 2] * w2 * .5;
                        a += data1[idx3 + 3] * w2 * .5;
                        t += .5 * w2;
                    }
                    if (t > 0 && a > 0) {
                        r = r / t;
                        g = g / t;
                        b = b / t;
                        a = a / t;
                    } else {
                        r = 0;
                        g = 0;
                        b = 0;
                        a = 0;
                    }
                    data[idx] = r;
                    data[idx + 1] = g;
                    data[idx + 2] = b;
                    data[idx + 3] = a;
                }
            }

            ctx.putImageData(imgData, 0, 0);
        }

    <script>
        /**
        * A small PNG generator lib
        *
        * @version 1.0
        * @author Robert Eisele
        * @copyright Copyright (c) 2010, Robert Eisele
        * @link https://raw.org/article/generate-client-side-png-files-using-javascript/

        (function () {

            // helper functions for that ctx
            function write(buffer, offs) {
                for (var i = 2; i < arguments.length; i++) {
                    for (var j = 0; j < arguments[i].length; j++) {
                        buffer[offs++] = arguments[i].charAt(j);
                    }
                }
            }

            function byte2(w) {
                return String.fromCharCode((w >> 8) & 255, w & 255);
            }

            function byte4(w) {
                return String.fromCharCode((w >> 24) & 255, (w >> 16) & 255, (w >> 8) & 255, w & 255);
            }

            function byte2lsb(w) {
                return String.fromCharCode(w & 255, (w >> 8) & 255);
            }

            window.PNGlib = function (width, height, depth) {

                this.width = width;
                this.height = height;
                this.depth = depth;

                // pixel data and row filter identifier size
                this.pix_size = height * (width + 1);

                // deflate header, pix_size, block headers, adler32 checksum
                this.data_size = 2 + this.pix_size + 5 * Math.floor((0xfffe + this.pix_size) / 0xffff) + 4;

                // offsets and sizes of Png chunks
                this.ihdr_offs = 0;									// IHDR offset and size
                this.ihdr_size = 4 + 4 + 13 + 4;
                this.plte_offs = this.ihdr_offs + this.ihdr_size;	// PLTE offset and size
                this.plte_size = 4 + 4 + 3 * depth + 4;
                this.trns_offs = this.plte_offs + this.plte_size;	// tRNS offset and size
                this.trns_size = 4 + 4 + depth + 4;
                this.idat_offs = this.trns_offs + this.trns_size;	// IDAT offset and size
                this.idat_size = 4 + 4 + this.data_size + 4;
                this.iend_offs = this.idat_offs + this.idat_size;	// IEND offset and size
                this.iend_size = 4 + 4 + 4;
                this.buffer_size = this.iend_offs + this.iend_size;	// total PNG size

                this.buffer = new Array();
                this.palette = new Object();
                this.pindex = 0;

                var _crc32 = new Array();

                // initialize buffer with zero bytes
                for (var i = 0; i < this.buffer_size; i++) {
                    this.buffer[i] = "\x00";
                }

                // initialize non-zero elements
                write(this.buffer, this.ihdr_offs, byte4(this.ihdr_size - 12), 'IHDR', byte4(width), byte4(height), "\x08\x03");
                write(this.buffer, this.plte_offs, byte4(this.plte_size - 12), 'PLTE');
                write(this.buffer, this.trns_offs, byte4(this.trns_size - 12), 'tRNS');
                write(this.buffer, this.idat_offs, byte4(this.idat_size - 12), 'IDAT');
                write(this.buffer, this.iend_offs, byte4(this.iend_size - 12), 'IEND');

                // initialize deflate header
                var header = ((8 + (7 << 4)) << 8) | (3 << 6);
                header += 31 - (header % 31);

                write(this.buffer, this.idat_offs + 8, byte2(header));

                // initialize deflate block headers
                for (var i = 0; (i << 16) - 1 < this.pix_size; i++) {
                    var size, bits;
                    if (i + 0xffff < this.pix_size) {
                        size = 0xffff;
                        bits = "\x00";
                    } else {
                        size = this.pix_size - (i << 16) - i;
                        bits = "\x01";
                    }
                    write(this.buffer, this.idat_offs + 8 + 2 + (i << 16) + (i << 2), bits, byte2lsb(size), byte2lsb(~size));
                }

                /* Create crc32 lookup table */
                for (var i = 0; i < 256; i++) {
                    var c = i;
                    for (var j = 0; j < 8; j++) {
                        if (c & 1) {
                            c = -306674912 ^ ((c >> 1) & 0x7fffffff);
                        } else {
                            c = (c >> 1) & 0x7fffffff;
                        }
                    }
                    _crc32[i] = c;
                }

                // compute the index into a png for a given pixel
                this.index = function (x, y) {
                    var i = y * (this.width + 1) + x + 1;
                    var j = this.idat_offs + 8 + 2 + 5 * Math.floor((i / 0xffff) + 1) + i;
                    return j;
                }

                // convert a color and build up the palette
                this.color = function (red, green, blue, alpha) {
                    alpha = alpha >= 0 ? alpha : 255;
                    var color = (((((alpha << 8) | red) << 8) | green) << 8) | blue;

                    if (typeof this.palette[color] == "undefined") {
                        if (this.pindex == this.depth) return "\x00";

                        var ndx = this.plte_offs + 8 + 3 * this.pindex;

                        this.buffer[ndx + 0] = String.fromCharCode(red);
                        this.buffer[ndx + 1] = String.fromCharCode(green);
                        this.buffer[ndx + 2] = String.fromCharCode(blue);
                        this.buffer[this.trns_offs + 8 + this.pindex] = String.fromCharCode(alpha);

                        this.palette[color] = String.fromCharCode(this.pindex++);
                    }
                    return this.palette[color];
                }

                // output a PNG string, Base64 encoded
                this.getBase64 = function () {

                    var s = this.getDump();

                    // If the current browser supports the Base64 encoding
                    // function, then offload the that to the browser as it
                    // will be done in native code.
                    if ((typeof window.btoa !== 'undefined') && (window.btoa !== null)) {
                        return window.btoa(s);
                    }

                    var ch = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=";
                    var c1, c2, c3, e1, e2, e3, e4;
                    var l = s.length;
                    var i = 0;
                    var r = "";

                    do {
                        c1 = s.charCodeAt(i);
                        e1 = c1 >> 2;
                        c2 = s.charCodeAt(i + 1);
                        e2 = ((c1 & 3) << 4) | (c2 >> 4);
                        c3 = s.charCodeAt(i + 2);
                        if (l < i + 2) { e3 = 64; } else { e3 = ((c2 & 0xf) << 2) | (c3 >> 6); }
                        if (l < i + 3) { e4 = 64; } else { e4 = c3 & 0x3f; }
                        r += ch.charAt(e1) + ch.charAt(e2) + ch.charAt(e3) + ch.charAt(e4);
                    } while ((i += 3) < l);
                    return r;
                }

                // output a PNG string
                this.getDump = function () {

                    // compute adler32 of output pixels + row filter bytes
                    var BASE = 65521; /* largest prime smaller than 65536 */
                    var NMAX = 5552;  /* NMAX is the largest n such that 255n(n+1)/2 + (n+1)(BASE-1) <= 2^32-1 */
                    var s1 = 1;
                    var s2 = 0;
                    var n = NMAX;

                    for (var y = 0; y < this.height; y++) {
                        for (var x = -1; x < this.width; x++) {
                            s1 += this.buffer[this.index(x, y)].charCodeAt(0);
                            s2 += s1;
                            if ((n -= 1) == 0) {
                                s1 %= BASE;
                                s2 %= BASE;
                                n = NMAX;
                            }
                        }
                    }
                    s1 %= BASE;
                    s2 %= BASE;
                    write(this.buffer, this.idat_offs + this.idat_size - 8, byte4((s2 << 16) | s1));

                    // compute crc32 of the PNG chunks
                    function crc32(png, offs, size) {
                        var crc = -1;
                        for (var i = 4; i < size - 4; i += 1) {
                            crc = _crc32[(crc ^ png[offs + i].charCodeAt(0)) & 0xff] ^ ((crc >> 8) & 0x00ffffff);
                        }
                        write(png, offs + size - 4, byte4(crc ^ -1));
                    }

                    crc32(this.buffer, this.ihdr_offs, this.ihdr_size);
                    crc32(this.buffer, this.plte_offs, this.plte_size);
                    crc32(this.buffer, this.trns_offs, this.trns_size);
                    crc32(this.buffer, this.idat_offs, this.idat_size);
                    crc32(this.buffer, this.iend_offs, this.iend_size);

                    // convert PNG to string
                    return "\x89PNG\r\n\x1a\n" + this.buffer.join('');
                }

                // add a colour to the palette, even if it is already there
                this.forceAddColorToPalette = function (red, green, blue, alpha) {
                    if (this.pindex == this.depth) return "\x00";

                    alpha = alpha >= 0 ? alpha : 255;
                    var color = (((((alpha << 8) | red) << 8) | green) << 8) | blue;

                    var ndx = this.plte_offs + 8 + 3 * this.pindex;

                    this.buffer[ndx + 0] = String.fromCharCode(red);
                    this.buffer[ndx + 1] = String.fromCharCode(green);
                    this.buffer[ndx + 2] = String.fromCharCode(blue);
                    this.buffer[this.trns_offs + 8 + this.pindex] = String.fromCharCode(alpha);

                    const colorIndex = String.fromCharCode(this.pindex++);
                    if (typeof this.palette[color] == "undefined") {
                        this.palette[color] = colorIndex;
                    }
                    return colorIndex;
                }

                this.setPixel = function (x, y, colourIndex) {
                    this.buffer[this.index(x, y)] = String.fromCharCode(colourIndex);
                }

                this.setPallette = function (palette) {
                    this.palette = new Object();
                    this.pindex = 0;
                    for (const color of palette) {
                        this.forceAddColorToPalette(color[0], color[1], color[2], 255);
                    }
                }
            }

        })();
